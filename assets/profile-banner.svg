<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Alessandro Rizzi — Full-Stack Developer</title>
  <desc id="desc">A dark neon terminal-inspired profile banner with an isometric cube illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B18"/>
      <stop offset=".52" stop-color="#15143A"/>
      <stop offset="1" stop-color="#062D3B"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" x2="1">
      <stop stop-color="#F3F7FF"/>
      <stop offset=".65" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#312E81"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A5B4FC" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <ellipse cx="1000" cy="132" rx="300" ry="220" fill="url(#glow)"/>
  <path d="M0 226C210 186 330 286 560 236s407-45 640-9" fill="none" stroke="#22D3EE" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 230C210 190 330 290 560 240s407-45 640-9" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="30 520" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="550;0" dur="8s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="86" y="67" fill="#67E8F9" font-size="15" font-weight="700" letter-spacing="4">ALESSANDRO RIZZI  /  DEVELOPER</text>
    <text x="82" y="137" fill="url(#titleGlow)" font-size="54" font-weight="700" letter-spacing="1">FULL-STACK</text>
    <text x="84" y="179" fill="#D8E3F4" font-size="22" font-weight="500">Developer · UX · IT &amp; AI</text>
    <text x="86" y="222" fill="#94A3B8" font-family="Consolas,monospace" font-size="15">&gt; building clear digital experiences</text>
    <rect x="370" y="207" width="9" height="19" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(910 46)">
    <circle cx="120" cy="90" r="112" fill="none" stroke="#A78BFA" stroke-opacity=".24" stroke-width="1.5" stroke-dasharray="3 9"/>
    <g opacity=".75">
      <animateTransform attributeName="transform" type="rotate" from="0 120 90" to="360 120 90" dur="42s" repeatCount="indefinite"/>
      <circle cx="120" cy="90" r="91" fill="none" stroke="#22D3EE" stroke-opacity=".28" stroke-width="1"/>
      <circle cx="120" cy="-1" r="4" fill="#67E8F9"/>
      <circle cx="211" cy="90" r="3" fill="#A78BFA"/>
    </g>
    <path d="M120 22 186 60v76l-66 38-66-38V60z" fill="#0B1228" fill-opacity=".4" stroke="#67E8F9" stroke-opacity=".72" stroke-width="2"/>
    <path d="m120 22 66 38-66 39-66-39z" fill="url(#cubeTop)" fill-opacity=".82"/>
    <path d="M54 60v76l66 38V99z" fill="#312E81" fill-opacity=".92"/>
    <path d="M186 60v76l-66 38V99z" fill="url(#cubeSide)" fill-opacity=".94"/>
    <path d="m120 22 66 38-66 39-66-39zM120 99v75m-66-114 66 39 66-39" fill="none" stroke="#C4B5FD" stroke-opacity=".85" stroke-width="1.5"/>
    <path d="M120 46v29m-13-21 13-8 13 8" fill="none" stroke="#F0FDFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="32" r="4" fill="#22D3EE"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="218" cy="154" r="3" fill="#C4B5FD"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M48 22h28M48 22v28M1152 22h-28m28 0v28M48 258h28m-28 0v-28m1104 28h-28m28 0v-28" fill="none" stroke="#67E8F9" stroke-opacity=".48" stroke-width="2"/>
</svg>